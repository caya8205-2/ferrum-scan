[package]
name = "ferrum-scan"
version = "0.1.0"
edition = "2021"
authors = ["caya8205-2"]
description = "Ultra-fast multithreaded repository scanner and health inspector written in pure Rust"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
ignore = "0.4"
rayon = "1.10"
comfy-table = "7.1"
crossterm = "0.28"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
