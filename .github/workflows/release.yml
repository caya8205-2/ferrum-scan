name: Build and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check Version & Release Status
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.check_release.outputs.exists }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          VERSION=$(grep '^version =' Cargo.toml | head -n 1 | cut -d '"' -f 2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"

      - name: Check if release exists
        id: check_release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          if gh api "repos/${{ github.repository }}/releases/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "Release v$VERSION already exists. Skipping build."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "Release v$VERSION not found. Will create release."
          fi

  build-binaries:
    name: Build Binary
    needs: check-version
    if: needs.check-version.outputs.exists == 'false'
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact_name: ferrum-scan.exe
            asset_name: ferrum-scan.exe
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact_name: ferrum-scan
            asset_name: ferrum-scan-linux
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact_name: ferrum-scan
            asset_name: ferrum-scan-macos

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare Asset
        shell: bash
        run: |
          cp target/${{ matrix.target }}/release/${{ matrix.artifact_name }} ./${{ matrix.asset_name }}

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}

  create-release:
    name: Publish GitHub Release
    needs: [check-version, build-binaries]
    if: needs.check-version.outputs.exists == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrum-scan.exe

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrum-scan-linux

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: ferrum-scan-macos

      - name: Create Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.check-version.outputs.version }}"
          gh release create "v$VERSION" \
            ferrum-scan.exe \
            ferrum-scan-linux \
            ferrum-scan-macos \
            --title "v$VERSION" \
            --generate-notes
